name: Publish APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate APK and Checksum
        run: |
          set -eo pipefail

          echo "Checking APK existence..."
          if [ ! -f "apk-distribution/app-debug.apk" ]; then
            echo "Error: apk-distribution/app-debug.apk not found!" >&2
            exit 1
          fi

          if [ ! -s "apk-distribution/app-debug.apk" ]; then
            echo "Error: apk-distribution/app-debug.apk is empty!" >&2
            exit 1
          fi

          echo "Checking checksum file existence..."
          if [ ! -f "apk-distribution/app-debug.apk.sha256" ]; then
            echo "Error: apk-distribution/app-debug.apk.sha256 not found!" >&2
            exit 1
          fi

          echo "Verifying SHA-256 checksum..."
          cd apk-distribution
          sha256sum -c app-debug.apk.sha256
          cd ..

          echo "Verifying APK zip structure..."
          unzip -tq apk-distribution/app-debug.apk

          echo "APK validation passed successfully."

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }} (Attempt ${{ github.run_attempt }})"
          APK_PATH="apk-distribution/app-debug.apk"
          CHECKSUM_FILE="apk-distribution/app-debug.apk.sha256"

          APK_SIZE_BYTES=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          APK_SIZE_HUMAN=$(numfmt --to=iec-i --suffix=B "$APK_SIZE_BYTES" 2>/dev/null || ls -lh "$APK_PATH" | awk '{print $5}')
          SHA256_VAL=$(awk '{print $1}' "$CHECKSUM_FILE")

          NOTES="### Android Debug APK Release
          - **Application**: AddonVault
          - **Build Tag**: \`${TAG}\`
          - **APK Filename**: \`app-debug.apk\`
          - **File Size**: ${APK_SIZE_HUMAN} (${APK_SIZE_BYTES} bytes)
          - **SHA-256 Checksum**:
          \`\`\`
          ${SHA256_VAL}
          \`\`\`

          #### Direct Download
          - [\`app-debug.apk\`](https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk)"

          echo "Creating GitHub Release with tag ${TAG}..."
          gh release create "$TAG" "$APK_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

          echo "Release published successfully at: $RELEASE_URL"
          echo "Direct download link: $DOWNLOAD_URL"

          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 APK Release Published Successfully
          - **Release Tag**: \`${TAG}\`
          - **APK Size**: ${APK_SIZE_HUMAN} (${APK_SIZE_BYTES} bytes)
          - **SHA-256**: \`${SHA256_VAL}\`
          - **Release Page**: [View Release](${RELEASE_URL})
          - **Direct APK Download**: [Download app-debug.apk](${DOWNLOAD_URL})
          EOF
